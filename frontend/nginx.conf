# Served by the web container. The React app uses client-side routing, so any path that is not a
# real file falls back to index.html; without this a browser refresh on /my-applications returns 404.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
